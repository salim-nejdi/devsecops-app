name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:

  lint-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .

      - name: Tests
        run: |
          pytest -v


  build-and-push:
    runs-on: ubuntu-24.04
    needs: lint-and-test

    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Build image
        run: |
          docker build \
          -t ghcr.io/salim-nejdi/devsecops-app:${GITHUB_SHA::7} \
          .

      - name: Push image
        run: |
          docker push \
          ghcr.io/salim-nejdi/devsecops-app:${GITHUB_SHA::7}
