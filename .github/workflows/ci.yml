name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:

  lint-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .

      - name: Tests
        run: |
          pytest -v


  secret-scan:
    runs-on: ubuntu-24.04
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  sast:
    runs-on: ubuntu-24.04
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python


  dependency-scan:
    runs-on: ubuntu-24.04
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false


  iac-scan:
    runs-on: ubuntu-24.04
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'


  docker-build-scan-push:
    runs-on: ubuntu-24.04

    needs:
      - secret-scan
      - sast
      - dependency-scan
      - iac-scan

    # On attend le résultat de TOUS les scans.
    # Le job peut ainsi construire/scanner l'image même si
    # un autre contrôle sécurité a échoué.
    if: always() && github.event_name == 'push'

    env:
      IMAGE_NAME: ghcr.io/salim-nejdi/devsecops-app:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}" \
            .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false

      - name: Login to GHCR
        if: |
          success() &&
          needs.secret-scan.result == 'success' &&
          needs.sast.result == 'success' &&
          needs.dependency-scan.result == 'success' &&
          needs.iac-scan.result == 'success'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push image to GHCR
        if: |
          success() &&
          needs.secret-scan.result == 'success' &&
          needs.sast.result == 'success' &&
          needs.dependency-scan.result == 'success' &&
          needs.iac-scan.result == 'success'
        run: |
          docker push "${IMAGE_NAME}"
